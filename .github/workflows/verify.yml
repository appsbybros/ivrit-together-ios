name: Verify iOS build and tests

# Started by hand only (Actions > Verify iOS build and tests > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check resources and store texts
        shell: bash
        run: python3 Scripts/validate.py

      - name: Install or verify XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Choose an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          # Only runtimes the selected Xcode can run: not newer than its simulator SDK (the
          # runner may also hold the runtimes of other installed Xcode versions).
          sdk_text = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          sdk = tuple(int(part) for part in sdk_text.split(".")[:2] if part.isdigit())
          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          choices = []
          for runtime, devices in listing["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[1].split("-") if part.isdigit())
              for device in devices:
                  if device.get("isAvailable", True) and device["name"].startswith("iPhone"):
                      choices.append(((version, "Pro" in device["name"], device["name"]), device))
          usable = [choice for choice in choices if choice[0][0][:2] <= sdk] or choices
          if not usable:
              raise SystemExit("No available iPhone simulator")
          (version, _, name), device = max(usable, key=lambda choice: choice[0])
          print(f"Simulator: {name}, iOS {'.'.join(map(str, version))} (simulator SDK {sdk_text})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SIMULATOR_ID={device['udid']}\n")
          PY

      - name: Build, run the unit tests and compile Release for devices
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/logs
          status=0
          COMMON=(-project IvritTogether.xcodeproj -scheme IvritTogether -derivedDataPath build/DerivedData)
          SIMULATOR=(-destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)

          echo "Compiling the app and its unit tests for the simulator"
          xcodebuild build-for-testing "${COMMON[@]}" "${SIMULATOR[@]}" > build/logs/build-for-testing.log 2>&1
          build_status=$?
          if (( build_status != 0 )); then
            echo "::error::Compile failed for the app or its tests"
            status=$build_status
          else
            echo "Running the unit tests"
            xcodebuild test-without-building "${COMMON[@]}" "${SIMULATOR[@]}" \
              -resultBundlePath build/UnitTests.xcresult > build/logs/unit-tests.log 2>&1
            test_status=$?
            if (( test_status != 0 )); then
              echo "::error::Unit tests failed"
              status=$test_status
            fi
            echo "Compiling Release for iOS devices, unsigned"
            xcodebuild build "${COMMON[@]}" -configuration Release -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build/logs/release-device.log 2>&1
            release_status=$?
            if (( release_status != 0 )); then
              echo "::error::Release compile for iOS devices failed"
              status=$release_status
            fi
          fi

          # Every distinct compiler error and test failure with file and line, in the log and
          # the run summary, as the Minik compile check does.
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = os.environ.get("GITHUB_WORKSPACE", "") + "/"
          compiler, failures, totals = [], [], []
          for log in sorted(Path("build/logs").glob("*.log")):
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  entry = line.replace(root, "").strip()
                  if re.search(r"error: -\[", line) or "Fatal error:" in line or ("crashed" in line.lower() and "test" in line.lower()):
                      if entry not in failures:
                          failures.append(entry)
                  elif re.search(r"(^|\s|:)(error|fatal error): ", line) or line.startswith("ld: ") or "Undefined symbol" in line:
                      if entry not in compiler:
                          compiler.append(entry)
                  elif re.search(r"Executed \d+ tests?, with \d+ failures?", line) and entry not in totals:
                      totals.append(entry)
          compiler_text = "\n".join(compiler) if compiler else "No compiler errors."
          failure_text = "\n".join(failures) if failures else "No test failures."
          totals_text = "\n".join(totals[-1:]) if totals else "No test results (tests did not run)."
          Path("build/logs/errors.txt").write_text(compiler_text + "\n\n" + failure_text + "\n", encoding="utf-8")
          print(compiler_text)
          print(failure_text)
          print(totals_text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Compiler errors (%d)\n\n```\n%s\n```\n\n" % (len(compiler), compiler_text))
                  handle.write("## Test failures (%d)\n\n```\n%s\n```\n\n" % (len(failures), failure_text))
                  handle.write("## Unit tests\n\n```\n%s\n```\n" % totals_text)
          PY
          exit $status

      - name: Upload logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Verify-logs
          path: |
            build/logs
            build/UnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
