name: IvritTogether
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.appsbybros
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    # The app's Apple ID in App Store Connect (digits). The TestFlight workflow passes it in,
    # so Rate and Share link to the App Store page. Empty in local and simulator builds.
    IVRIT_APP_STORE_ID: ""

targets:
  IvritTogether:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Identical copies of the Android app's assets, read at runtime.
      - path: Resources/course.json
        buildPhase: resources
      - path: Resources/ui.json
        buildPhase: resources
      # Interface texts only the iOS screens use; ui.json stays identical to Android.
      - path: Resources/ui-ios.json
        buildPhase: resources
      # The short chime after a right answer (rendered by Scripts/make_sound.py).
      - path: Resources/success.wav
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # One InfoPlist.strings per interface language, so iOS and the App Store list all ten.
      - path: Resources/Localization
    info:
      path: Generated/IvritTogether-Info.plist
      properties:
        CFBundleDisplayName: Ivrit Together
        # XcodeGen otherwise writes 1.0 (1), ignoring the version build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru, uk, fr, es, pt, ar, am, de, he]
        # No encryption beyond what the operating system provides; the app has no network code.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # As on Android, the light palette is kept in Dark Mode.
        UIUserInterfaceStyle: Light
        # Android allows every orientation and resizing (no screenOrientation, resizeableActivity).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        IvritAppStoreID: $(IVRIT_APP_STORE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.ivrittogether
        PRODUCT_NAME: IvritTogether
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  IvritTogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: IvritTogether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.ivrittogether.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  IvritTogether:
    build:
      targets:
        IvritTogether: all
        IvritTogetherTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - IvritTogetherTests
    archive:
      config: Release
